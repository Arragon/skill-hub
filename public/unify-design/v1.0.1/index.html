<script data-asset="assets/js/unify-design.js">
/* Unify Design UI Kit — framework-free, scoped behavior primitives. */
(function (global) {
  "use strict";
  const api = global.UnifyDesign = global.UnifyDesign || {};
  const instances = new WeakMap();
  const busyButtons = new WeakMap();
  const toastGroups = new WeakMap();
  let nextId = 0;
  const uid = (prefix) => prefix + "-" + (++nextId);

  function uiRoot(root) {
    const candidate = root || global.document.querySelector(".ud-app");
    if (!candidate || !candidate.matches || !candidate.matches(".ud-app")) {
      throw new TypeError("UnifyDesign expects a .ud-app root element.");
    }
    return candidate;
  }

  function isDisabled(element) {
    return element.disabled || element.getAttribute("aria-disabled") === "true";
  }

  function init(root) {
    root = uiRoot(root);
    if (instances.has(root)) {
      const existing = instances.get(root);
      existing.refresh();
      return existing;
    }
    const doc = root.ownerDocument;
    const dialogs = new Map();
    const fieldDescriptions = new WeakMap();
    let destroyed = false;
    let lastFocused = doc.activeElement;

    function tabsIn(group) {
      return Array.from(group.querySelectorAll('[role="tab"]')).filter((tab) =>
        tab.closest("[data-ud-tabs]") === group &&
        tab.closest('[role="tablist"]') &&
        group.contains(doc.getElementById(tab.getAttribute("aria-controls")))
      );
    }

    function activateTab(tab, notify) {
      const group = tab.closest("[data-ud-tabs]");
      if (!group || isDisabled(tab)) return;
      const tabs = tabsIn(group);
      if (!tabs.includes(tab)) return;
      const previous = tabs.find((item) => item.getAttribute("aria-selected") === "true");
      tabs.forEach((item) => {
        const selected = item === tab;
        item.setAttribute("aria-selected", String(selected));
        item.tabIndex = selected ? 0 : -1;
        const panel = doc.getElementById(item.getAttribute("aria-controls"));
        panel.hidden = !selected;
      });
      if (notify && previous !== tab) {
        group.dispatchEvent(new CustomEvent("ud:tabchange", {
          bubbles: true,
          detail: { tab, panel: doc.getElementById(tab.getAttribute("aria-controls")), previous }
        }));
      }
      syncToggles(true);
    }

    function linkFields() {
      root.querySelectorAll(".ud-field").forEach((field) => {
        const control = field.querySelector("input, select, textarea");
        if (!control) return;
        if (!control.id) control.id = uid("ud-field");
        const label = field.querySelector("label");
        if (label && !label.htmlFor) label.htmlFor = control.id;
        const notes = Array.from(field.querySelectorAll(".ud-field-hint, .ud-field-error"));
        notes.forEach((note) => {
          if (!note.id) note.id = uid("ud-description");
        });
        const managedIds = new Set([...(fieldDescriptions.get(control) || []), ...notes.map((note) => note.id)]);
        const existing = (control.getAttribute("aria-describedby") || "").split(/\s+/)
          .filter((id) => id && !managedIds.has(id));
        notes.filter((note) => !note.hidden && note.textContent.trim()).forEach((note) => {
          if (!existing.includes(note.id)) existing.push(note.id);
        });
        if (existing.length) control.setAttribute("aria-describedby", existing.join(" "));
        else control.removeAttribute("aria-describedby");
        fieldDescriptions.set(control, new Set(notes.map((note) => note.id)));
        const hasError = notes.some((note) => note.classList.contains("ud-field-error") && !note.hidden && note.textContent.trim());
        if (hasError) {
          control.setAttribute("aria-invalid", "true");
          control.dataset.udAutoInvalid = "true";
        } else if (control.dataset.udAutoInvalid === "true") {
          control.removeAttribute("aria-invalid");
          delete control.dataset.udAutoInvalid;
        }
      });
    }

    function bindDialog(dialog) {
      if (dialogs.has(dialog)) return dialogs.get(dialog);
      const state = { trigger: null };
      const onClose = () => {
        const trigger = state.trigger;
        state.trigger = null;
        if (trigger && trigger.isConnected && !isDisabled(trigger) && !trigger.closest("[hidden], [inert]")) {
          trigger.focus({ preventScroll: true });
        }
      };
      dialog.addEventListener("close", onClose);
      state.cleanup = () => dialog.removeEventListener("close", onClose);
      dialogs.set(dialog, state);
      return state;
    }

    function openDialog(dialog, trigger) {
      if (destroyed) throw new Error("UnifyDesign instance has been destroyed.");
      if (!dialog || dialog.tagName !== "DIALOG" || !root.contains(dialog)) {
        throw new TypeError("The dialog must be a native <dialog> inside this .ud-app root.");
      }
      if (typeof dialog.showModal !== "function") {
        throw new Error("This browser requires a native dialog polyfill supplied by the host project.");
      }
      if (dialog.open) return;
      bindDialog(dialog).trigger = trigger || doc.activeElement;
      dialog.showModal();
    }

    function isRendered(element) {
      if (element.hidden || element.closest("[hidden], [inert]")) return false;
      const style = global.getComputedStyle(element);
      return style.display !== "none" && style.visibility !== "hidden" && element.getClientRects().length > 0;
    }

    function syncToggles(restoreFocus) {
      const hiddenRegions = new Set();
      root.querySelectorAll("[data-ud-toggle]").forEach((button) => {
        const region = doc.getElementById(button.dataset.udToggle);
        if (!region || !root.contains(region)) return;
        region.setAttribute("data-ud-collapsible", "");
        const expanded = isRendered(region);
        button.setAttribute("aria-controls", region.id);
        button.setAttribute("aria-expanded", String(expanded));
        if (!expanded) hiddenRegions.add(region);
      });
      if (restoreFocus) hiddenRegions.forEach((region) => {
        const current = doc.activeElement;
        const lostFocus = region.contains(current) ||
          ((current === doc.body || current === root) && lastFocused && region.contains(lastFocused));
        if (!lostFocus) return;
        const trigger = Array.from(root.querySelectorAll("[data-ud-toggle]")).find((button) =>
          button.dataset.udToggle === region.id && !isDisabled(button) && isRendered(button));
        if (trigger) trigger.focus({ preventScroll: true });
      });
    }

    function onFocusIn(event) { lastFocused = event.target; }
    function onResize() { if (!destroyed) syncToggles(true); }

    function setToggle(target, expanded, trigger) {
      const hadFocus = target.contains(doc.activeElement);
      if (expanded) target.hidden = false;
      target.dataset.open = String(expanded);
      syncToggles(false);
      if (!expanded && hadFocus && trigger) trigger.focus();
      target.dispatchEvent(new CustomEvent("ud:toggle", { bubbles: true, detail: { expanded } }));
    }

    function onClick(event) {
      const target = event.target.closest && event.target.closest("[role=tab], [data-ud-dialog-open], [data-ud-dialog-close], [data-ud-toggle], [aria-disabled=true]");
      if (!target || !root.contains(target)) return;
      if (isDisabled(target)) { event.preventDefault(); return; }
      if (target.matches('[role="tab"]')) {
        if (target.closest("[data-ud-tabs]")) { event.preventDefault(); activateTab(target, true); }
      } else if (target.hasAttribute("data-ud-dialog-open")) {
        event.preventDefault();
        openDialog(doc.getElementById(target.dataset.udDialogOpen), target);
      } else if (target.hasAttribute("data-ud-dialog-close")) {
        const dialog = target.closest("dialog");
        if (dialog && dialog.open) { event.preventDefault(); dialog.close(target.dataset.udDialogClose || "cancel"); }
      } else if (target.hasAttribute("data-ud-toggle")) {
        const region = doc.getElementById(target.dataset.udToggle);
        if (region && root.contains(region)) {
          event.preventDefault();
          setToggle(region, !isRendered(region), target);
        }
      }
    }

    function onKeydown(event) {
      const tab = event.target.closest && event.target.closest('[role="tab"]');
      const group = tab && tab.closest("[data-ud-tabs]");
      if (group && root.contains(group)) {
        const tabs = tabsIn(group).filter((item) => !isDisabled(item));
        const index = tabs.indexOf(tab);
        if (index < 0) return;
        const vertical = tab.closest('[role="tablist"]').getAttribute("aria-orientation") === "vertical";
        const rtl = global.getComputedStyle(group).direction === "rtl";
        const nextKey = vertical ? "ArrowDown" : rtl ? "ArrowLeft" : "ArrowRight";
        const prevKey = vertical ? "ArrowUp" : rtl ? "ArrowRight" : "ArrowLeft";
        let newIndex = null;
        if (event.key === nextKey) newIndex = (index + 1) % tabs.length;
        if (event.key === prevKey) newIndex = (index - 1 + tabs.length) % tabs.length;
        if (event.key === "Home") newIndex = 0;
        if (event.key === "End") newIndex = tabs.length - 1;
        if (newIndex !== null) {
          event.preventDefault();
          tabs.forEach((item, i) => { item.tabIndex = i === newIndex ? 0 : -1; });
          tabs[newIndex].focus();
        } else if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          activateTab(tab, true);
        }
      }
      if (event.key === "Escape" && !event.target.closest("dialog[open]")) {
        const region = event.target.closest('[data-ud-collapsible]');
        if (region && root.contains(region) && isRendered(region)) {
          const trigger = Array.from(root.querySelectorAll("[data-ud-toggle]")).find((button) => button.dataset.udToggle === region.id);
          if (trigger) { event.preventDefault(); setToggle(region, false, trigger); }
        }
      }
    }

    function refresh() {
      if (destroyed) throw new Error("UnifyDesign instance has been destroyed.");
      root.querySelectorAll("[data-ud-tabs]").forEach((group) => {
        const tabs = tabsIn(group);
        tabs.forEach((tab) => {
          if (!tab.id) tab.id = uid("ud-tab");
          if (tab.tagName === "BUTTON" && !tab.hasAttribute("type")) tab.type = "button";
          const panel = doc.getElementById(tab.getAttribute("aria-controls"));
          panel.setAttribute("role", "tabpanel");
          panel.setAttribute("aria-labelledby", tab.id);
          if (!panel.hasAttribute("tabindex")) panel.tabIndex = 0;
        });
        const selected = tabs.find((tab) => tab.getAttribute("aria-selected") === "true" && !isDisabled(tab)) || tabs.find((tab) => !isDisabled(tab));
        if (selected) activateTab(selected, false);
      });
      root.querySelectorAll("dialog").forEach(bindDialog);
      syncToggles(true);
      linkFields();
    }

    function destroy() {
      if (destroyed) return;
      destroyed = true;
      root.removeEventListener("click", onClick);
      root.removeEventListener("keydown", onKeydown);
      root.removeEventListener("focusin", onFocusIn);
      global.removeEventListener("resize", onResize);
      dialogs.forEach((state, dialog) => {
        if (dialog.open) dialog.close("destroy");
        state.cleanup();
      });
      dialogs.clear();
      const toasts = toastGroups.get(root);
      if (toasts) Array.from(toasts).forEach((dismiss) => dismiss());
      instances.delete(root);
    }

    const instance = { refresh, destroy, openDialog };
    instances.set(root, instance);
    root.addEventListener("click", onClick);
    root.addEventListener("keydown", onKeydown);
    root.addEventListener("focusin", onFocusIn);
    global.addEventListener("resize", onResize);
    refresh();
    return instance;
  }

  function toast(message, options) {
    options = options || {};
    const root = uiRoot(options.root);
    const doc = root.ownerDocument;
    const parent = root.querySelector("dialog[open]") || root;
    let stack = Array.from(parent.children).find((child) => child.classList.contains("ud-toast-stack"));
    if (!stack) {
      stack = doc.createElement("div");
      stack.className = "ud-toast-stack";
      stack.setAttribute("aria-label", "通知");
      parent.appendChild(stack);
    }
    const tone = ["primary", "success", "warning", "danger"].includes(options.tone) ? options.tone : "primary";
    const node = doc.createElement("div");
    node.className = "ud-toast";
    node.dataset.tone = tone;
    node.setAttribute("role", tone === "danger" ? "alert" : "status");
    const text = doc.createElement("span");
    text.className = "ud-grow ud-break";
    text.textContent = String(message);
    const close = doc.createElement("button");
    close.type = "button";
    close.className = "ud-btn ud-icon-btn";
    close.dataset.variant = "ghost";
    close.setAttribute("aria-label", "关闭通知");
    close.textContent = "×";
    node.append(text, close);
    stack.appendChild(node);
    let timer = null;
    let removed = false;
    const duration = options.duration === undefined ? (tone === "danger" ? 0 : 4500) : Number(options.duration);
    let group = toastGroups.get(root);
    if (!group) { group = new Set(); toastGroups.set(root, group); }
    function dismiss() {
      if (removed) return;
      removed = true;
      global.clearTimeout(timer);
      node.remove();
      group.delete(dismiss);
      if (!stack.children.length) stack.remove();
    }
    function pause() { global.clearTimeout(timer); }
    function resume() {
      pause();
      if (Number.isFinite(duration) && duration > 0) timer = global.setTimeout(dismiss, duration);
    }
    close.addEventListener("click", dismiss);
    node.addEventListener("pointerenter", pause);
    node.addEventListener("pointerleave", resume);
    node.addEventListener("focusin", pause);
    node.addEventListener("focusout", resume);
    group.add(dismiss);
    resume();
    return { dismiss, element: node };
  }

  function setBusy(button, busy) {
    if (!button || button.tagName !== "BUTTON") throw new TypeError("setBusy expects a native button.");
    if (busy) {
      if (!busyButtons.has(button)) busyButtons.set(button, { disabled: button.disabled, ariaBusy: button.getAttribute("aria-busy") });
      button.disabled = true;
      button.setAttribute("aria-busy", "true");
    } else if (busyButtons.has(button)) {
      const previous = busyButtons.get(button);
      button.disabled = previous.disabled;
      if (previous.ariaBusy === null) button.removeAttribute("aria-busy");
      else button.setAttribute("aria-busy", previous.ariaBusy);
      busyButtons.delete(button);
    }
  }

  function downloadBlob(blob, filename) {
    if (!(blob instanceof global.Blob)) throw new TypeError("downloadBlob expects a Blob.");
    const url = global.URL.createObjectURL(blob);
    const anchor = global.document.createElement("a");
    anchor.href = url;
    anchor.download = String(filename || "download").replace(/[\\/\u0000-\u001f]/g, "_").slice(0, 240);
    anchor.hidden = true;

 const before=h('div',{class:'ud-before'},h('div',{style:'background:#f8f8f8;padding:14px;margin-bottom:8px;font-size:18px'},'欢迎使用配置系统'),h('div',{style:'padding:11px;background:white;margin-bottom:8px'},'这里您可以对所有配置项目进行一站式操作'),h('div',{style:'padding:10px;background:white'},'统计  |  介绍  |  重复入口'),h('div',{style:'margin-top:12px;height:45px;background:#ddd'},'数据区被向下挤压'));

function designMenu(){const trigger=$('#ud-design-menu');$('.ud-popover')?.remove();const pop=h('div',{class:'ud-popover',role:'dialog','aria-label':'外观设置',style:'width:240px'}),head=h('div',{class:'ud-col',style:'gap:10px;padding:5px 8px 10px'},h('strong',{},'外观与密度'));

 const contrast=h('label',{class:'ud-toggle'},h('input',{type:'checkbox',checked:document.body.dataset.contrast==='high'}),'增强文字与边界对比');contrast.firstChild.addEventListener('change',e=>document.body.dataset.contrast=e.target.checked?'high':'normal');
 head.append(field('强调色',accent),field('组件密度',density),contrast);pop.append(head);

 setTimeout(()=>{document.addEventListener('click',close,true);document.addEventListener('keydown',close,true)},0);
}
function commandPalette(){const dlg=$('#ud-command-dialog'),input=$('#ud-command-input'),results=$('#ud-command-results');if(dlg.open)return;dlg.showModal();input.value='';let selected=0,matches=[];
 function draw(){const q=input.value.trim().toLowerCase();matches=PAGES.filter(p=>!q||p.name.toLowerCase().includes(q)||p.id.includes(q));results.replaceChildren();if(!matches.length){results.append(empty('没有找到匹配页面','尝试使用“配置”“日志”“审批”等关键词。'));return}matches.forEach((p,i)=>{const b=h('button',{class:'ud-file-folder'+(i===selected?' is-active':''),style:'border-radius:6px',type:'button',onclick:()=>{dlg.close('open');navigate(p.id)}},icon(p.icon),h('span',{class:'ud-grow'},p.name),icon('arrow','sm'));results.append(b)})}
 input.oninput=()=>{selected=0;draw()};input.onkeydown=e=>{if(e.key==='ArrowDown'){e.preventDefault();selected=Math.min(matches.length-1,selected+1);draw()}else if(e.key==='ArrowUp'){e.preventDefault();selected=Math.max(0,selected-1);draw()}else if(e.key==='Enter'&&matches[selected]){e.preventDefault();dlg.close('open');navigate(matches[selected].id)}};draw();input.focus();}
function setup(){

 state.scope=UD.createWorkspaceScope({initialId:'east',confirmLeave:async({from,to})=>{const ok=await confirmAction({title:'切换全局工作区',message:`${from==='east'?'华东研发中心':'深圳验证中心'} 有尚未保存的参数草稿。放弃这些修改并切换到 ${to==='east'?'华东研发中心':'深圳验证中心'}？`,confirmText:'放弃修改并切换',danger:true});return ok},onReset:context=>{

  state.matrix.drafts[context.previousId]={};state.workspace=context.workspaceId;

 onChange:context=>state.scope.run(async()=>({rows:state.dataByWorkspace[context.workspaceId],logs:state.logsByWorkspace[context.workspaceId]}),(payload)=>{
  state.data=payload.rows;state.logs=payload.logs;state.matrix.page=1;state.matrix.search='';state.matrix.family='all';state.matrix.onlyChanged=false;state.matrix.view='table';state.selectedParam='PM-0001';state.log.search='';state.log.level='all';state.log.selected=0;state.files.selected=state.files.items[state.workspace][0].name;state.approval.selected=getApprovals()[0].id;renderNavigation();renderTabs();renderActive();syncHeader();})});
